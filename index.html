<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora de Promedio de Notas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="contenedor-principal">
        <h1>Calculadora de Promedio</h1>
        <p>Ingrese las tres notas del corte para calcular el promedio.</p>

        <label for="inputNota1">Nota 1:</label>
        <input type="number" id="inputNota1" step="0.1">

        <label for="inputNota2">Nota 2:</label>
        <input type="number" id="inputNota2" step="0.1">

        <label for="inputNota3">Nota 3:</label>
        <input type="number" id="inputNota3" step="0.1">

        <button onclick="calcularPromedioNotas()">Calcular</button>

        <p id="textoResultadoPromedio"></p>
        <p id="textoResultadoEstado"></p>
    </div>

<script>
let notasArray = [];
let promedioFinal = 0;
const divisorCantidadNotas = 3;

function calcularPromedioNotas() {
    let nota1 = parseFloat(document.getElementById("inputNota1").value);
    let nota2 = parseFloat(document.getElementById("inputNota2").value);
    let nota3 = parseFloat(document.getElementById("inputNota3").value);

    console.log("Valores capturados:", nota1, nota2, nota3);

    if (isNaN(nota1) || isNaN(nota2) || isNaN(nota3)) {
        document.getElementById("textoResultadoPromedio").innerHTML = "Debe ingresar las tres notas.";
        document.getElementById("textoResultadoEstado").innerHTML = "";
        return;
    }

    promedioFinal = (nota1 + nota2 + nota3) / divisorCantidadNotas;

    document.getElementById("textoResultadoPromedio").innerHTML = "Promedio: " + promedioFinal.toFixed(2);

    if (promedioFinal >= 3.0) {
        document.getElementById("textoResultadoEstado").innerHTML = "Resultado: aprobado";
    } else {
        document.getElementById("textoResultadoEstado").innerHTML = "Resultado: reprobado";
    }

    console.log("Promedio calculado con éxito");
}

console.log("Página cargada correctamente");
</script>

</body>
</html>
